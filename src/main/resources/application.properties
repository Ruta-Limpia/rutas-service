spring.application.name=rutas-service

server.port=8084

# Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/rl_rutas?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT & Claves Internas
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
app.internal.key=${INTERNAL_KEY}

# URL de Microservicios externos
app.solicitudes.url=http://localhost:8082

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html