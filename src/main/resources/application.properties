spring.application.name=rutas-service

server.port=8084

# Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/rl_rutas?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT & Claves Internas
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
app.internal.key=rl-internal-dev

# URL de Microservicios externos
app.solicitudes.url=http://localhost:8082

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html